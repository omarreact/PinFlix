name: MovieBox Cloudflare Staging QA

on:
  push:
    branches:
      - qa/cloudflare-moviebox-runtime-20261117
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://cf-migrate-pinflix-stage.farukkhanone.workers.dev
      SAMPLE_ID: mb-6391474290696802080~inception-e1BOR6f19C7
    steps:
      - uses: actions/checkout@v4

      - name: Catalogue, search and health smoke
        shell: bash
        run: |
          set -euo pipefail
          for path in / /catalogue "/search?q=inception" "/api/search?q=inception"; do
            code="$(curl --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 40 -sS -o /tmp/body -w '%{http_code}' "$BASE_URL$path")"
            echo "$path -> $code"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "Unexpected status for $path" >&2
              head -c 1600 /tmp/body || true
              exit 1
            fi
          done

          health_code="$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/health.json -w '%{http_code}' "$BASE_URL/api/health" || true)"
          echo "/api/health -> $health_code"
          HEALTH_CODE="$health_code" node - <<'NODE'
          const fs=require("fs");
          const x=JSON.parse(fs.readFileSync("/tmp/health.json","utf8"));
          const code=Number(process.env.HEALTH_CODE);
          if(code!==200 && !(code===503 && x.reason==="moviebox_upstream_rate_limited")) throw new Error("Unexpected MovieBox health failure");
          console.log("health:",JSON.stringify({ok:x.ok,degraded:x.degraded,reason:x.reason,home:x.probes?.home?.http,filter:x.probes?.filter?.http}));
          NODE

          curl -fsS --connect-timeout 10 --max-time 45 "$BASE_URL/api/search?q=inception" > /tmp/search.json
          node - <<'NODE'
          const fs=require("fs");
          const x=JSON.parse(fs.readFileSync("/tmp/search.json","utf8"));
          const items=Array.isArray(x.entertainment)?x.entertainment:[];
          if(!items.length) throw new Error("MovieBox search returned no titles");
          if(!items.every(x=>x.provider==="moviebox")) throw new Error("Non-MovieBox source detected");
          console.log("MovieBox search items:",items.length,items.slice(0,3).map(x=>x.title).join(" | "));
          NODE

      - name: Playback resolver and direct-CDN viability audit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 45 "$BASE_URL/api/resolve?id=$SAMPLE_ID" > /tmp/resolve.json
          BASE_URL="$BASE_URL" node - <<'NODE'
          const fs=require("fs");
          const x=JSON.parse(fs.readFileSync("/tmp/resolve.json","utf8"));
          if(x.provider!=="moviebox") throw new Error("Resolver is not MovieBox");
          if(!Array.isArray(x.sources)||!x.sources.length) throw new Error("No playback sources");
          const src=x.sources[0];
          const u=new URL(src.url,process.env.BASE_URL);
          const raw=u.searchParams.get("url");
          console.log("resolver source protocol:",src.protocol);
          console.log("resolver delivery:",u.pathname.startsWith("/api/proxy-stream")?"application-proxy":"direct");
          if(raw){
            fs.writeFileSync("/tmp/direct-url",raw);
            fs.writeFileSync("/tmp/direct-protocol",src.protocol||"unknown");
          }
          NODE

          if [ -s /tmp/direct-url ]; then
            DIRECT_URL="$(cat /tmp/direct-url)"
            PROTOCOL="$(cat /tmp/direct-protocol)"
            code="$(curl -L --connect-timeout 10 --max-time 30 -sS -r 0-2047 -D /tmp/direct-headers -o /tmp/direct-body -w '%{http_code}' -e "$BASE_URL/" "$DIRECT_URL" || true)"
            echo "direct provider probe -> HTTP $code ($PROTOCOL)"
            grep -iE '^(content-type|content-range|accept-ranges|access-control-allow-origin|cache-control):' /tmp/direct-headers || true
            echo "$code" > /tmp/direct-status
          else
            echo "Resolver did not expose a proxied raw URL; already direct or unsupported."
          fi

      - name: Install isolated Playwright runner
        shell: bash
        run: |
          mkdir -p /tmp/pwqa
          cd /tmp/pwqa
          npm init -y >/dev/null
          npm install --no-audit --no-fund @playwright/test@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Desktop and mobile browser smoke
        shell: bash
        run: |
          cat > /tmp/pwqa/runtime.mjs <<'EOF'
          import { chromium } from "@playwright/test";
          const base=process.env.BASE_URL;
          const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,args:["--no-sandbox","--disable-dev-shm-usage"]});
          const failures=[];
          for (const cfg of [
            {name:"desktop",viewport:{width:1440,height:900}},
            {name:"mobile",viewport:{width:390,height:844}},
          ]) {
            const context=await browser.newContext({viewport:cfg.viewport});
            const page=await context.newPage();
            const pageErrors=[];
            page.on("pageerror",e=>pageErrors.push(String(e)));
            for (const path of ["/","/catalogue","/search?q=inception"]) {
              const response=await page.goto(base+path,{waitUntil:"domcontentloaded",timeout:45000});
              const status=response?.status()||0;
              console.log(cfg.name,path,status,await page.title());
              if(status<200||status>=400) failures.push(cfg.name+" "+path+" HTTP "+status);
              await page.waitForTimeout(1200);
              const body=(await page.locator("body").innerText()).trim();
              if(body.length<80) failures.push(cfg.name+" "+path+" body too small");
            }
            for(const e of pageErrors) failures.push(cfg.name+" pageerror "+e);
            await context.close();
          }
          await browser.close();
          if(failures.length){console.error(failures.join("\n"));process.exit(1);}
          EOF
          cd /tmp/pwqa
          BASE_URL="$BASE_URL" node runtime.mjs
