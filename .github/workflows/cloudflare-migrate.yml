name: Prepare Cloudflare Workers Migration

on:
  push:
    branches: [cloudflare-workers-migration]
    paths:
      - ".github/workflows/cloudflare-migrate.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v5
        with:
          ref: cloudflare-workers-migration

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Align React with vinext App Router runtime
        run: npm install --save-exact react@19.3.0 react-dom@19.3.0

      - name: Initialize vinext for Cloudflare Workers
        run: npx --yes vinext@latest init --platform=cloudflare --skip-check --force

      - name: Build Cloudflare target
        run: npm run build:vinext

      - name: Verify original Next.js build remains healthy
        run: npm run check

      - name: Commit generated migration files
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: prepare PinFlix for Cloudflare Workers"
          git push origin HEAD:cloudflare-workers-migration
