name: Cloudflare Workers Compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [cloudflare-workers-migration, main]

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify existing Next.js application
        run: npm run check

      - name: Verify vinext compatibility
        run: npx --yes vinext@latest check

      - name: Build Cloudflare Workers target
        run: npm run build:vinext

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
