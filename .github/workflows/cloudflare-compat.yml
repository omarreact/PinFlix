name: Cloudflare Workers Compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [cloudflare-workers-migration, main]

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify existing Next.js application
        run: npm run check

      - name: Verify vinext compatibility
        run: npx --yes vinext@latest check

      - name: Build Cloudflare Workers target
        run: npm run build:vinext

      - name: Smoke test local Workers runtime
        shell: bash
        run: |
          npm run start:vinext -- --host 127.0.0.1 --port 3001 > /tmp/pinflix-vinext.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3001/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/pinflix-vinext.log
            exit 1
          fi

          curl --fail --silent --show-error --max-time 30 http://127.0.0.1:3001/api/health > /tmp/health.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/health.json","utf8")); if (x.service !== "pinflix" || x.provider !== "cineplexbd") process.exit(1); console.log(JSON.stringify(x));'

          PROXY_STATUS=$(curl --silent --show-error --max-time 30 --output /tmp/proxy-response.txt --write-out "%{http_code}" "http://127.0.0.1:3001/api/playback/proxy?url=http%3A%2F%2Fcineplexbd.net%2F")
          if [ "$PROXY_STATUS" = "500" ] || grep -qi "not implemented" /tmp/proxy-response.txt; then
            cat /tmp/proxy-response.txt
            exit 1
          fi
          echo "Playback proxy route runtime status: $PROXY_STATUS"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
