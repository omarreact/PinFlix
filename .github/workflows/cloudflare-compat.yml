name: Cloudflare Workers Compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [cloudflare-workers-migration, main]

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify existing Next.js application
        run: npm run check

      - name: Verify vinext compatibility
        run: npx --yes vinext@latest check

      - name: Build Cloudflare Workers target
        run: npm run build:vinext

      - name: Package Cloudflare output
        run: tar -czf pinflix-cloudflare-output.tgz .cloudflare/output cloudflare.config.ts vite.config.ts package.json package-lock.json

      - name: Upload Cloudflare output artifact
        uses: actions/upload-artifact@v5
        with:
          name: pinflix-cloudflare-output
          path: pinflix-cloudflare-output.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Smoke test local Workers runtime
        shell: bash
        run: |
          npm run start:vinext -- --host 127.0.0.1 --port 3001 > /tmp/pinflix-vinext.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 30); do
            STATUS=$(curl --silent --show-error --max-time 3 --output /tmp/auth.json --write-out "%{http_code}" http://127.0.0.1:3001/api/nid-dob/auth || true)
            if [ "$STATUS" = "200" ]; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/pinflix-vinext.log
            exit 1
          fi

          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/auth.json","utf8")); if (x.ok !== true || typeof x.authenticated !== "boolean") process.exit(1);'

          # Import and execute the guarded playback route without depending on upstream availability.
          PROXY_STATUS=$(curl --silent --show-error --max-time 5 --output /tmp/proxy-response.json --write-out "%{http_code}" http://127.0.0.1:3001/api/playback/proxy)
          if [ "$PROXY_STATUS" != "400" ]; then
            cat /tmp/proxy-response.json
            cat /tmp/pinflix-vinext.log
            exit 1
          fi
          grep -q "Missing upstream url param" /tmp/proxy-response.json
          echo "Local Workers runtime smoke test passed."

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
