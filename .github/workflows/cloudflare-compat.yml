name: Cloudflare Workers Compatibility

on:
  push:
    branches: [cloudflare-workers-migration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Verify current application
        run: npm run check

      - name: Run vinext compatibility check
        run: npx --yes vinext@latest check
