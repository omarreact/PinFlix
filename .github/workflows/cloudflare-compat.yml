name: Cloudflare Workers Compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [cloudflare-workers-migration, main]

permissions:
  contents: write

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify existing Next.js application
        run: npm run check

      - name: Verify vinext compatibility
        run: npx --yes vinext@latest check

      - name: Build Cloudflare Workers target
        run: npm run build:vinext

      - name: Build connector deployment package
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = ".cloudflare/output/v0/workers/default/bundle";
          const out = ".cloudflare/output/pinflix-worker-upload.multipart";
          const boundary = "----PinFlixWorkerUploadBoundary20261002";

          function walk(dir, base = "") {
            const entries = fs.readdirSync(dir, { withFileTypes: true });
            const files = [];
            for (const entry of entries) {
              const rel = base ? base + "/" + entry.name : entry.name;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (rel === ".vite") continue;
                files.push(...walk(full, rel));
              } else if (entry.isFile()) {
                files.push(rel);
              }
            }
            return files;
          }

          const metadata = {
            main_module: "index.js",
            compatibility_date: "2026-10-02",
            compatibility_flags: ["nodejs_compat"],
            observability: { enabled: true },
            bindings: [
              {
                type: "service",
                name: "ASSETS",
                service: "pinflix-assets"
              },
              {
                type: "plain_text",
                name: "CINEPLEX_CATALOG_RELAY_URL",
                text: "https://media.pincodeit.com/catalog"
              }
            ],
            annotations: {
              "workers/message": "PinFlix vinext migration verified build"
            }
          };

          // vinext expects a native assets binding. Our connector-safe deployment
          // uses a private asset Worker, so route immutable client assets there
          // before the vinext request handler runs.
          const entryPath = path.join(root, "index.js");
          let entry = fs.readFileSync(entryPath, "utf8");
          const exportMarker =
            'var Ng=jg??{};export{Ng as default,Bo as i,zo as n,Ro as r,Vo as t};';
          const wrappedExport =
            'var Ng=jg??{},Pg={...Ng,async fetch(e,t,n){let r=new URL(e.url);if((r.pathname.startsWith("/_next/static/")||r.pathname==="/vinext-client-entry-manifest.json")&&t?.ASSETS)return t.ASSETS.fetch(e);return Ng.fetch(e,t,n)}};export{Pg as default,Bo as i,zo as n,Ro as r,Vo as t};';
          if (!entry.includes(exportMarker)) {
            throw new Error("Unable to patch vinext asset routing: export marker changed.");
          }
          entry = entry.replace(exportMarker, wrappedExport);
          fs.writeFileSync(entryPath, entry);

          const chunks = [];
          const push = (value) => chunks.push(Buffer.isBuffer(value) ? value : Buffer.from(value));
          push("--" + boundary + "\r\n");
          push('Content-Disposition: form-data; name="metadata"\r\n');
          push("Content-Type: application/json\r\n\r\n");
          push(JSON.stringify(metadata));
          push("\r\n");

          for (const rel of walk(root)) {
            // Cloudflare's Worker module upload accepts JS/WASM modules here.
            // JSON/CSS build metadata is not uploaded as a server module; client
            // assets are served by the private pinflix-assets service.
            if (!rel.endsWith(".js") && !rel.endsWith(".wasm")) continue;

            const full = path.join(root, rel);
            const type = rel.endsWith(".wasm")
              ? "application/wasm"
              : "application/javascript+module";

            push("--" + boundary + "\r\n");
            push('Content-Disposition: form-data; name="' + rel + '"; filename="' + rel + '"\r\n');
            push("Content-Type: " + type + "\r\n\r\n");
            push(fs.readFileSync(full));
            push("\r\n");
          }

          push("--" + boundary + "--\r\n");
          fs.writeFileSync(out, Buffer.concat(chunks));
          fs.writeFileSync(
            ".cloudflare/output/pinflix-worker-upload.content-type",
            "multipart/form-data; boundary=" + boundary
          );
          console.log("Generated connector upload package:", fs.statSync(out).size, "bytes");
          NODE

      - name: Package Cloudflare output
        run: tar -czf pinflix-cloudflare-output.tgz .cloudflare/output cloudflare.config.ts vite.config.ts package.json package-lock.json

      - name: Upload Cloudflare output artifact
        uses: actions/upload-artifact@v5
        with:
          name: pinflix-cloudflare-output
          path: pinflix-cloudflare-output.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Smoke test local Workers runtime
        shell: bash
        run: |
          npm run start:vinext -- --host 127.0.0.1 --port 3001 > /tmp/pinflix-vinext.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 30); do
            STATUS=$(curl --silent --show-error --max-time 3 --output /tmp/auth.json --write-out "%{http_code}" http://127.0.0.1:3001/api/nid-dob/auth || true)
            if [ "$STATUS" = "200" ]; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/pinflix-vinext.log
            exit 1
          fi

          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/auth.json","utf8")); if (x.ok !== true || typeof x.authenticated !== "boolean") process.exit(1);'

          # Import and execute the guarded playback route without depending on upstream availability.
          PROXY_STATUS=$(curl --silent --show-error --max-time 5 --output /tmp/proxy-response.json --write-out "%{http_code}" http://127.0.0.1:3001/api/playback/proxy)
          if [ "$PROXY_STATUS" != "400" ]; then
            cat /tmp/proxy-response.json
            cat /tmp/pinflix-vinext.log
            exit 1
          fi
          grep -q "Missing upstream url param" /tmp/proxy-response.json
          echo "Local Workers runtime smoke test passed."

      - name: Probe deployed Cloudflare staging runtime
        shell: bash
        run: |
          set -uo pipefail

          MEDIA_HTTP="$(curl --show-error --silent --max-time 15 --output /tmp/pinflix-media-health.json --write-out "%{http_code}" https://media.pincodeit.com/health || true)"
          STATUS_HTTP="$(curl --show-error --silent --max-time 20 --output /tmp/pinflix-cineplex-status.json --write-out "%{http_code}" https://pinflix-staging.pincodeit.com/api/cineplexbd/status || true)"
          CATALOG_HTTP="$(curl --show-error --silent --max-time 20 --output /tmp/pinflix-catalog.json --write-out "%{http_code}" "https://pinflix-staging.pincodeit.com/api/cineplexbd/catalog?category=cineplex-movies-english&page=1" || true)"

          MEDIA_BODY="$(cat /tmp/pinflix-media-health.json 2>/dev/null || true)"
          STATUS_BODY="$(cat /tmp/pinflix-cineplex-status.json 2>/dev/null || true)"
          CATALOG_BODY="$(cat /tmp/pinflix-catalog.json 2>/dev/null || true)"

          {
            echo "## Cloudflare staging smoke report"
            echo
            echo "- media HTTP: $MEDIA_HTTP"
            echo "- status HTTP: $STATUS_HTTP"
            echo "- catalog HTTP: $CATALOG_HTTP"
            echo
            echo "### media"
            echo '~~~json'
            printf '%s\n' "$MEDIA_BODY" | head -c 4000
            echo
            echo '~~~'
            echo "### status"
            echo '~~~json'
            printf '%s\n' "$STATUS_BODY" | head -c 4000
            echo
            echo '~~~'
            echo "### catalog sample"
            echo '~~~json'
            printf '%s\n' "$CATALOG_BODY" | head -c 4000
            echo
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

          node - "$MEDIA_HTTP" "$STATUS_HTTP" "$CATALOG_HTTP" <<'NODE'
          const fs = require("fs");
          const [mediaHttp, statusHttp, catalogHttp] = process.argv.slice(2);
          const readJson = (path) => {
            try { return JSON.parse(fs.readFileSync(path, "utf8")); } catch { return null; }
          };
          const media = readJson("/tmp/pinflix-media-health.json");
          const status = readJson("/tmp/pinflix-cineplex-status.json");
          const catalog = readJson("/tmp/pinflix-catalog.json");

          const failures = [];
          if (mediaHttp !== "200") failures.push("media endpoint HTTP " + mediaHttp);
          if (!media || media.ok !== true || media.service !== "pinflix-media-edge") failures.push("media health payload invalid");
          if (media?.upstream?.reachable !== true) failures.push("Cloudflare media Worker cannot reach Cineplex upstream");
          if (statusHttp !== "200") failures.push("staging status HTTP " + statusHttp);
          if (status?.provider !== "cineplexbd") failures.push("staging provider status invalid");
          if (status?.connectivity?.reachable !== true) failures.push("staging Cineplex connectivity is not reachable");
          if (status?.connectivity?.transport !== "relay") failures.push("staging is not using relay transport");
          if (status?.taxonomy?.source !== "live") failures.push("staging taxonomy is not live");
          if (catalogHttp !== "200") failures.push("catalog HTTP " + catalogHttp);
          if (!Array.isArray(catalog?.items) || catalog.items.length === 0) failures.push("catalog returned no items");

          if (failures.length) {
            console.error(failures.join("; "));
            process.exit(1);
          }

          const poster = catalog.items.find((item) => typeof item.poster === "string" && item.poster.startsWith("/cineplex-origin/"))?.poster;
          if (!poster) {
            console.error("No proxied Cineplex poster found in catalog.");
            process.exit(1);
          }
          fs.writeFileSync("/tmp/pinflix-poster-path.txt", poster);
          NODE

          POSTER_PATH="$(cat /tmp/pinflix-poster-path.txt)"
          POSTER_HTTP="$(curl --show-error --silent --max-time 20 --head --output /tmp/pinflix-poster-headers.txt --write-out "%{http_code}" "https://pinflix-staging.pincodeit.com$POSTER_PATH" || true)"
          echo "- poster HTTP: $POSTER_HTTP" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$POSTER_HTTP" != 2* && "$POSTER_HTTP" != 3* ]]; then
            echo "Poster smoke check failed with HTTP $POSTER_HTTP" >&2
            exit 1
          fi
          echo "Deployed Cloudflare staging smoke test passed."

      - name: Upload Cloudflare smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cloudflare-smoke-diagnostics
          path: |
            /tmp/pinflix-media-health.json
            /tmp/pinflix-cineplex-status.json
            /tmp/pinflix-catalog.json
            /tmp/pinflix-poster-path.txt
            /tmp/pinflix-poster-headers.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Publish verified Cloudflare build output
        if: github.event_name == 'push' && (github.ref_name == 'cloudflare-workers-migration' || github.ref_name == 'main')
        shell: bash
        run: |
          rm -rf /tmp/pinflix-cloudflare-publish
          mkdir -p /tmp/pinflix-cloudflare-publish/.cloudflare
          cp -R .cloudflare/output /tmp/pinflix-cloudflare-publish/.cloudflare/output

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan cloudflare-built-output
          git rm -rf . >/dev/null 2>&1 || true
          cp -R /tmp/pinflix-cloudflare-publish/.cloudflare .
          git add -f .cloudflare/output
          git commit -m "build: publish verified Cloudflare output"
          git push --force origin HEAD:cloudflare-built-output
