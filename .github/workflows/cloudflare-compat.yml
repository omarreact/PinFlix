name: Cloudflare Workers Compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [cloudflare-workers-migration, main]

permissions:
  contents: read

concurrency:
  group: cloudflare-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify existing Next.js application
        run: npm run check

      - name: Verify vinext compatibility
        run: npx --yes vinext@latest check

      - name: Build Cloudflare Workers target
        run: npm run build:vinext

      - name: Verify native Cloudflare static assets
        shell: bash
        run: |
          test -f .cloudflare/output/v0/workers/default/assets/vinext-client-entry-manifest.json
          find .cloudflare/output/v0/workers/default/assets/_next/static -type f | grep -q .
          test -f .cloudflare/output/v0/workers/default/bundle/index.js

          node <<'NODE'
          const fs = require("fs");
          const config = JSON.parse(fs.readFileSync("wrangler.deploy.jsonc", "utf8"));
          if (!config.assets?.directory) throw new Error("Cloudflare native static asset directory is missing.");
          if (config.assets.binding !== "ASSETS") throw new Error("ASSETS must be a native static assets binding.");
          if (config.assets.run_worker_first !== false) throw new Error("Static assets must be served before the Worker.");
          if (config.services?.some?.((x) => x.binding === "ASSETS")) {
            throw new Error("ASSETS must not be a service binding.");
          }
          NODE

      - name: Package verified Cloudflare output
        run: tar -czf pinflix-cloudflare-output.tgz .cloudflare/output cloudflare.config.ts wrangler.deploy.jsonc vite.config.ts package.json package-lock.json

      - name: Upload Cloudflare output artifact
        uses: actions/upload-artifact@v5
        with:
          name: pinflix-cloudflare-output
          path: pinflix-cloudflare-output.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Smoke test local Workers runtime
        shell: bash
        run: |
          npm run start:vinext -- --host 127.0.0.1 --port 3001 > /tmp/pinflix-vinext.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 30); do
            STATUS=$(curl --silent --show-error --max-time 3 --output /tmp/pinflix-home.html --write-out "%{http_code}" http://127.0.0.1:3001/ || true)
            if [ "$STATUS" = "200" ]; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/pinflix-vinext.log
            exit 1
          fi

          grep -q "PinFlix" /tmp/pinflix-home.html

          SEARCH_LOCAL_STATUS=$(curl --silent --show-error --max-time 5 --output /tmp/search-local.json --write-out "%{http_code}" "http://127.0.0.1:3001/api/search" || true)
          if [ "$SEARCH_LOCAL_STATUS" != "200" ]; then
            cat /tmp/search-local.json
            cat /tmp/pinflix-vinext.log
            exit 1
          fi
          node -e 'const j=require("/tmp/search-local.json"); if (!Array.isArray(j.entertainment)) process.exit(1)'
          echo "Local PinFlix Workers runtime smoke test passed."

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
