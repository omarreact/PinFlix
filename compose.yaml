services:
  app:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/pinflix.db
    volumes:
      - pinflix-data:/app/data
    restart: unless-stopped
    expose:
      - "3000"
  setup:
    build:
      context: .
      target: build
    profiles: [tools]
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/pinflix.db
    volumes:
      - pinflix-data:/app/data
    command: ["sh", "-c", "npm run db:setup && chown -R 1000:1000 /app/data"]
  ingest:
    build:
      context: .
      target: build
    profiles: [tools]
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/pinflix.db
    volumes:
      - pinflix-data:/app/data
    command: ["npm", "run", "ingest"]
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    restart: unless-stopped
volumes:
  pinflix-data:
